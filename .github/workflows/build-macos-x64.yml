name: Build macOS x64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package macOS x64
    runs-on: ${{ vars.MACOS_X64_RUNNER || 'macos-13' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm test
          npm run licenses:check

      - name: Package application
        run: npm run package:mac:x64

      - name: Verify x64 application
        run: npm run verify:mac:x64

      - name: Smoke test packaged application
        run: npm run smoke:packaged:mac:x64

      - name: Create downloadable archive
        run: ditto -c -k --sequesterRsrc --keepParent "dist/DeepSeek Harness UX First-darwin-x64/DeepSeek Harness UX First.app" "dist/DeepSeek-Harness-UX-First-macOS-x64.zip"

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Harness-UX-First-macOS-x64-${{ github.sha }}
          path: dist/DeepSeek-Harness-UX-First-macOS-x64.zip
          if-no-files-found: error
