name: Build Windows x64

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm test
          npm run licenses:check

      - name: Package application
        run: npm run package:win:x64

      - name: Verify Windows application
        run: npm run verify:win:x64

      - name: Smoke test packaged application
        run: npm run smoke:packaged:win:x64

      - name: Create downloadable archive
        shell: pwsh
        run: Compress-Archive -Path "dist\DeepSeek Harness UX First-win32-x64\*" -DestinationPath "dist\DeepSeek-Harness-UX-First-Windows-x64.zip"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Harness-UX-First-Windows-x64-${{ github.sha }}
          path: dist/DeepSeek-Harness-UX-First-Windows-x64.zip
          if-no-files-found: error
