name: Release ready-to-run desktop applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match tag to package version
        run: npm run release:verify-tag -- "${{ github.ref_name }}"

      - name: Run repository checks
        run: |
          npm test
          npm run licenses:check

  macos:
    name: Signed macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: ${{ matrix.arch == 'x64' && (vars.MACOS_X64_RUNNER || 'macos-15-intel') || 'macos-15' }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package ad-hoc signed application
        run: |
          ulimit -n 65536
          npm run package:mac:${{ matrix.arch }}

      - name: Verify packaged application
        run: npm run verify:mac:${{ matrix.arch }}

      - name: Smoke test packaged application
        run: npm run smoke:packaged:mac:${{ matrix.arch }}

      - name: Create release archive and checksum
        run: |
          archive="dist/DeepSeek-Harness-UX-First-macOS-${{ matrix.arch }}-${{ github.ref_name }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/DeepSeek Harness UX First-darwin-${{ matrix.arch }}/DeepSeek Harness UX First.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload macOS release
        uses: actions/upload-artifact@v7
        with:
          name: release-macOS-${{ matrix.arch }}
          path: |
            dist/DeepSeek-Harness-UX-First-macOS-${{ matrix.arch }}-${{ github.ref_name }}.zip
            dist/DeepSeek-Harness-UX-First-macOS-${{ matrix.arch }}-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  windows:
    name: Signed Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package portable application
        run: npm run package:win:x64

      - name: Verify packaged application
        run: npm run verify:win:x64

      - name: Smoke test packaged application
        run: npm run smoke:packaged:win:x64

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          $archive = "dist\DeepSeek-Harness-UX-First-Windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path "dist\DeepSeek Harness UX First-win32-x64\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Out-File -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: release-Windows-x64
          path: |
            dist/DeepSeek-Harness-UX-First-Windows-x64-${{ github.ref_name }}.zip
            dist/DeepSeek-Harness-UX-First-Windows-x64-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTICE: |
        Ready-to-run desktop packages are included below; Node.js and npm are not required.

        These community builds do not use commercial code-signing certificates. macOS builds are ad-hoc signed but not Apple-notarized, and Windows builds are unsigned. See the README for the expected Gatekeeper or SmartScreen first-launch steps. Verify downloads with SHA256SUMS.
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Combine SHA-256 checksums
        run: cat release/*.sha256 > release/SHA256SUMS

      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.zip release/SHA256SUMS --verify-tag --generate-notes --notes "$RELEASE_NOTICE" --title "DeepSeek Harness UX First ${{ github.ref_name }}"

      - name: Publish preview release
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.zip release/SHA256SUMS --verify-tag --prerelease --generate-notes --notes "$RELEASE_NOTICE" --title "DeepSeek Harness UX First ${{ github.ref_name }}"
