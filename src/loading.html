<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness UX First</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: 44px;
        app-region: drag;
        -webkit-app-region: drag;
      }
      main {
        width: min(440px, calc(100vw - 64px));
        text-align: center;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 24px;
        border-radius: 50%;
        corner-shape: round;
        display: grid;
        place-items: center;
        color: #4f72ff;
      }
      .mark svg {
        grid-area: 1 / 1;
        width: 48px;
        height: 48px;
      }
      .mark [data-lucide-animated-icon="loader-circle"] {
        animation: spin 900ms linear infinite;
      }
      .mark [data-lucide-animated-icon="badge-alert"] {
        display: none;
        color: #d84a4a;
      }
      [data-state="error"] .mark [data-lucide-animated-icon="loader-circle"] {
        display: none;
      }
      [data-state="error"] .mark [data-lucide-animated-icon="badge-alert"] {
        display: block;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 65%, transparent);
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      button {
        display: none;
        margin: 24px auto 0;
        border: 0;
        border-radius: 9px;
        corner-shape: superellipse(1.6);
        padding: 10px 18px;
        color: white;
        background: #315efb;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in srgb, #315efb 45%, transparent);
        outline-offset: 3px;
      }
      [data-state="error"] button {
        display: block;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark [data-lucide-animated-icon="loader-circle"] {
          animation: none;
        }
      }
    </style>
    <script src="./loading.js" defer></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg
          data-lucide-animated-icon="loader-circle"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <svg
          data-lucide-animated-icon="badge-alert"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
        >
          <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" />
          <line x1="12" x2="12" y1="8" y2="12" />
          <line x1="12" x2="12.01" y1="16" y2="16" />
        </svg>
      </div>
      <h1 id="title">正在启动 DeepSeek Harness</h1>
      <p id="message">第一次启动可能需要稍等片刻。</p>
      <button id="restart" type="button">重新启动</button>
    </main>
  </body>
</html>
